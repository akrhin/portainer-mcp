server:
  transport: stdio          # stdio | http
  listen: 127.0.0.1:17717   # http only
  read_only: false          # register only tools annotated read-only
  exhaustive: false         # every operation of the enabled sets, not the curated default set
instances:
  - name: homelab
    url: https://portainer.example.lan:9443
    api_key: ${PORTAINER_API_KEY}
    tls_verify: false
# core | docker | swarm | k8s | helm | stacks | gitops | edge | admin | observability | raw
toolsets: [core]
