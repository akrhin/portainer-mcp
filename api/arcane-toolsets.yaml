# Which Arcane tag becomes which toolset, and how operationIds turn into tool
# names. Read by tools/cataloggen; api/toolsets.yaml does the same for Portainer.
version: 1

toolsets: [core, containers, images, volumes, networks, projects, backups, gitops, swarm, podman, security, admin, uploads, push, events, auth, raw]

# One entry per tag of the Arcane document. Tags not listed here reach no
# toolset and stop the build, which is how a new Arcane tag gets noticed.
tags:
  arcane:
    Activities: core
    Diagnostics: core
    Environments: core
    Health: core
    System: core
    Version: core

    Containers: containers
    Ports: containers

    Application Images: images
    Container Registries: images
    Image Updates: images
    Images: images

    Volume Backup: volumes
    Volume Workspace: volumes
    Volumes: volumes

    Networks: networks

    Build Workspace: projects
    Project Workspace: projects
    Projects: projects
    Templates: projects
    Variables: projects

    S3 Destinations: backups
    System Backups: backups

    Git Repositories: gitops
    GitOps Syncs: gitops
    Webhooks: gitops

    Podman: podman
    Swarm: swarm

    API Keys: security
    Federated Credentials: security
    Roles: security
    Users: security
    Vulnerabilities: security

    Auth: admin
    Enrollment: admin
    JobSchedules: admin
    Notifications: admin
    Settings: admin
    Updater: admin

    Uploads: uploads
    Mobile Push: push
    Events: events
    Stream: events

    MFA: auth
    OIDC: auth
    Passkeys: auth

# The three job-run operations carry no tag in the document.
operation_toolsets:
  get-job-run: admin
  job-run-action: admin
  list-job-runs: admin

# An Auth operation that also carries a login factor belongs to the factor's
# set, so the factor operations land in one place instead of hiding in admin.
tag_priority: [Stream, MFA, OIDC, Passkeys]

# listGitOpsSyncs splits into list, git, ops, syncs; the alias keeps the word.
word_aliases:
  git_ops: gitops

# Names the derivation gets wrong: an unknown verb, two operations on one path,
# or two operations that would land on the same name.
rewrites:
  backup-has-path: volume_backup_path_exists
  check-image-update: image_update_check
  check-image-update-by-id: image_update_check_by_id
  check-image-update-by-id-post: image_update_check_by_id_post
  check-images: image_updates_check
  create-or-update-notification-settings: notification_settings_update
  create-system-backup: system_backup_create
  create-volume-backup: volume_backup_create
  delete-system-backup: system_backup_delete
  delete-volume-backup: volume_backup_delete
  df: disk_usage
  get-container-edit-config: container_edit_config
  get-current-user: current_user
  get-image-vulnerabilities: image_vulnerabilities_list
  get-update-info-by-refs: image_update_info_list
  get-update-summary: image_update_summary
  getVersion: server_version
  list-all-s3-destinations: s3_destination_options_list
  list-image-vulnerabilities: image_vulnerabilities_list_all
  prune-all: system_prune
  put-swarm-node-agent-binding: swarm_node_agent_binding_put
  system-health: system_health_head
  upload-chunk: upload_chunk
  upload-system-backup: system_backup_upload
  upload-volume-backup: volume_backup_upload

# Three operations never return on their own: an event long-poll, the upgrade
# progress feed and the event stream. They are read until timeout_sec instead
# of being refused, so the call answers with what arrived.
deadline_paths:
  - /stream
  - /agents/{id}/events/changes
  - /agents/{id}/system/upgrade/progress

extras:
  - name: arcane_raw
    toolset: raw
    base: /api
    description: >-
      Call any Arcane API path directly. Use it for an operation the catalog
      does not cover yet; method, path, query and body are sent as given.
