name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # goreleaser shells out to syft for the sboms block; the official installer
      # avoids a third-party action for one binary.
      - name: install syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # A package pushed by GITHUB_TOKEN starts private even in a public repo, and
      # an anonymous `docker pull` needs it public; both the release and the image
      # exist to be used, so the workflow opens it once per release.
      - name: make the container package public
        run: gh api -X PATCH "/users/${GITHUB_REPOSITORY_OWNER}/packages/container/portainer-mcp" -f visibility=public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
