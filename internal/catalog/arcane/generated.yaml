    - name: uploads
      tools:
        - name: upload_chunk
          description: Upload a chunk Upload one chunk of an upload session; re-sending a chunk is idempotent The body is sent as application/octet-stream.
          annotations:
            readOnlyHint: false
            destructiveHint: false
            idempotentHint: true
            openWorldHint: false
          input:
            additionalProperties: false
            properties:
                body:
                    additionalProperties: true
                    description: 'Raw request body, sent as application/octet-stream: {"content": "text"} or {"base64": "..."} for binary.'
                    type: object
                id:
                    type: string
                index:
                    format: int64
                    type: integer
                instance:
                    description: Name of a configured Arcane server; defaults to the first one.
                    type: string
                kind:
                    enum:
                        - image
                        - volume-backup
                        - build-workspace
                    type: string
                uploadId:
                    type: string
            required:
                - body
                - id
                - index
                - kind
                - uploadId
            type: object
          output:
            additionalProperties: true
            type: object
          operation:
            method: PUT
            path: /api/agents/{id}/uploads/{kind}/{uploadId}/chunks/{index}
            body: body
            binary: true
        - name: upload_session_create
          description: Create an upload session Start a chunked upload session; the file arrives as independently retryable chunks
          annotations:
            readOnlyHint: false
            destructiveHint: true
            openWorldHint: false
          input:
            additionalProperties: false
            properties:
                chunkSize:
                    description: Chunk size in bytes; server default and bounds apply
                    format: int64
                    type: integer
                filename:
                    description: Original filename; validated per kind
                    type: string
                id:
                    type: string
                instance:
                    description: Name of a configured Arcane server; defaults to the first one.
                    type: string
                kind:
                    enum:
                        - image
                        - volume-backup
                        - build-workspace
                    type: string
                size:
                    description: Total file size in bytes
                    format: int64
                    minimum: 1
                    type: integer
            required:
                - filename
                - id
                - kind
                - size
            type: object
          output:
            additionalProperties: true
            type: object
          operation:
            method: POST
            path: /api/agents/{id}/uploads/{kind}
            body: body
            body_fields:
                - chunkSize
                - filename
                - size
        - name: upload_session_delete
          description: Delete an upload session Abort an upload session and discard its received chunks
          annotations:
            readOnlyHint: false
            destructiveHint: true
            openWorldHint: false
          input:
            additionalProperties: false
            properties:
                id:
                    type: string
                instance:
                    description: Name of a configured Arcane server; defaults to the first one.
                    type: string
                kind:
                    enum:
                        - image
                        - volume-backup
                        - build-workspace
                    type: string
                uploadId:
                    type: string
            required:
                - id
                - kind
                - uploadId
            type: object
          output:
            additionalProperties: true
            type: object
          operation:
            method: DELETE
            path: /api/agents/{id}/uploads/{kind}/{uploadId}
        - name: upload_session_inspect
          description: Get an upload session Inspect an upload session to resume by re-sending only the missing chunks
          annotations:
            readOnlyHint: true
            idempotentHint: true
            openWorldHint: false
          input:
            additionalProperties: false
            properties:
                id:
                    type: string
                instance:
                    description: Name of a configured Arcane server; defaults to the first one.
                    type: string
                kind:
                    enum:
                        - image
                        - volume-backup
                        - build-workspace
                    type: string
                uploadId:
                    type: string
            required:
                - id
                - kind
                - uploadId
            type: object
          output:
            additionalProperties: true
            type: object
          operation:
            method: GET
            path: /api/agents/{id}/uploads/{kind}/{uploadId}
