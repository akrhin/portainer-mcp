    - name: raw
      tools:
        - name: arcane_raw
          description: Call any Arcane API path directly. Use it for an operation the catalog does not cover yet; method, path, query and body are sent as given.
          annotations:
            readOnlyHint: false
            destructiveHint: true
            openWorldHint: false
          input:
            additionalProperties: false
            properties:
                body:
                    additionalProperties: true
                    description: JSON request body, sent unchanged.
                    type: object
                instance:
                    description: Name of a configured Arcane server; defaults to the first one.
                    type: string
                method:
                    description: HTTP method.
                    enum:
                        - GET
                        - POST
                        - PUT
                        - PATCH
                        - DELETE
                    type: string
                path:
                    description: API path, starting with /, appended to /api.
                    type: string
                query:
                    additionalProperties: true
                    description: Query parameters; array values are sent as repeated keys.
                    type: object
            required:
                - method
                - path
            type: object
          operation:
            method: ""
            path: /api
            body: body
            raw: true
