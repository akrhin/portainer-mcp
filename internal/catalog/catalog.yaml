# Declarative tool catalog. Registration, read-only filtering and the golden
# test all read from this file; a tool that is not here cannot be called.
#
# Stage 0 implements the `core` handlers only. Every other toolset is declared
# with the operations named in docs/history/2026-11-16-market-research.ru.md
# (section 8); selecting one fails at startup with "not implemented yet".
# Tools are listed per operation; the report's per-toolset counts are budgets
# for merging verb families, which is a stage-1 decision.
version: 1

x-instance-param: &instance
  type: string
  description: Name of a configured Portainer instance; defaults to the first one.

toolsets:
  - name: core
    description: Server identity, status, settings and environment inventory. Read-only.
    depends_on: []
    tools:
      - name: system_version
        description: Portainer server version, API version and edition. Use it to check which features this server has before relying on them.
        annotations: {title: System version, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          properties:
            Version: {type: string, description: Portainer server version}
            ApiVersion: {type: string}
            ServerEdition: {type: string, description: CE or EE}
          additionalProperties: true

      - name: system_status
        description: Health of the Portainer server itself. Use it as a liveness check before a batch of calls.
        annotations: {title: System status, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          properties:
            Status: {type: string, description: up when the server is healthy}
          additionalProperties: true

      - name: system_info
        description: Runtime information of the Portainer server (host, platform, CPUs, memory). Use it to describe the deployment, not to act on it.
        annotations: {title: System info, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          additionalProperties: true

      - name: settings_get
        description: Effective Portainer settings (authentication, edge, snapshot interval, templates). Use it when behaviour depends on configuration; nothing here changes it.
        annotations: {title: Get settings, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          additionalProperties: true

      - name: whoami
        description: The user the configured API key belongs to. Use it first when a call fails with 401 or 403 to see whose permissions apply.
        annotations: {title: Current user, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          properties:
            Id: {type: integer}
            Username: {type: string}
            Role: {type: integer, description: "1 admin, 2 user"}
          additionalProperties: true

      - name: environment_list
        description: Environments (endpoints) reachable through this Portainer, without snapshots. Use it to find the environment id that other toolsets need.
        annotations: {title: List environments, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
          additionalProperties: false
        output:
          type: object
          properties:
            environments:
              type: array
              items:
                type: object
                properties:
                  id: {type: integer}
                  name: {type: string}
                  type: {type: string, description: "docker, agent, azure, edge-agent, kubernetes-local, kubernetes or edge-kubernetes"}
                  status: {type: string, description: "up, down or unknown"}
                  url: {type: string}
                required: [id, name]
          required: [environments]

      - name: environment_inspect
        description: One environment with its connection details and snapshot history. Use it after environment_list to check whether the agent behind an environment is reachable.
        annotations: {title: Inspect environment, readOnlyHint: true, idempotentHint: true, openWorldHint: true}
        input:
          type: object
          properties:
            instance: *instance
            id: {type: integer, description: Environment id from environment_list}
          required: [id]
          additionalProperties: false
        output:
          type: object
          properties:
            Id: {type: integer}
            Name: {type: string}
            Snapshots:
              type: array
              description: Snapshot history, newest last.
              items: {type: object, additionalProperties: true}
          additionalProperties: true

