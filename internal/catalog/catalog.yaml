# Curated catalog metadata: toolset names, descriptions and dependencies.
# The tools themselves are generated from the OpenAPI documents in api/ by
# tools/cataloggen into generated.yaml; edit api/toolsets.yaml to move an
# operation between sets, never this file's tool lists (there are none).
version: 1
toolsets:
  - name: core
    description: Server identity, status, settings and environment inventory. Read-only.
    depends_on: []

  - name: docker
    description: Docker containers, images, networks, volumes and daemon info through an environment.
    depends_on: [core]

  - name: swarm
    description: Docker Swarm services, nodes and tasks.
    depends_on: [docker]

  - name: k8s
    description: Kubernetes namespaces, workloads, services, config and cluster nodes.
    depends_on: [core]

  - name: helm
    description: Helm repositories, chart search and releases.
    depends_on: [k8s]

  - name: stacks
    description: Portainer compose stacks from file, git or string.
    depends_on: [docker]

  - name: gitops
    description: GitOps sources, file preview and workflows.
    depends_on: [stacks]

  - name: edge
    description: Edge groups, edge stacks, jobs, configs and update schedules.
    depends_on: [core]

  - name: admin
    description: Users, teams, permissions, registries and server administration.
    depends_on: [core]

  - name: observability
    description: User and endpoint activity, docker and kubernetes events.
    depends_on: [core]

  - name: raw
    description: Escape hatch — one raw request against Portainer, Docker or Kubernetes. Never enabled by a dependency.
    depends_on: []
